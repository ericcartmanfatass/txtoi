name: HyperOS 3 debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - hyperos3

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 37 platform
        run: |
          sdkmanager 'platforms;android-37.0'
          # AGP may look for android-37 while sdkmanager installs android-37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build debug, unit tests, metadata
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyModernXposedMetadata --no-daemon --stacktrace
      - name: Check APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: txtoi-hyperos3-h1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
